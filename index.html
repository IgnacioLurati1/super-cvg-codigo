<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tus entregas, archivos y notas del CVG, el campus virtual de UTN FRRO, en una sola pantalla. Herramienta no oficial." />
    <meta name="theme-color" content="#17324d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3578bd" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The campus speaks HTTP/1.1: each connection costs two round trips before the first answer. Opened while the
         page loads, the first request finds it ready (moodle.js asks without credentials, hence crossorigin). -->
    <link rel="preconnect" href="https://frro.cvg.utn.edu.ar" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Super CVG" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Super CVG</title>
    <script src="%BASE_URL%ajustes.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
