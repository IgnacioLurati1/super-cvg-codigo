# Checks every pull request and every push of the public copy: unit tests (with the site's rules,
# scripts/reglas.test.mjs), lint, and the build with its accessibility, text and size checks. No secrets: a pull
# request from a fork runs with read-only access, and the job installs packages without their install scripts.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned by commit (version beside it): a tag can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run check
        env:
          # Chromium comes with the GitHub machine.
          CHROME: /usr/bin/google-chrome
          CI: 'true'
